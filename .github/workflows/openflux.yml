name: OpenFlux Exit Node

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openflux:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    env:
      YANDEX_DOC_URL: ${{ secrets.YANDEX_DOC_URL }}

    steps:
      - name: Check secret
        shell: bash
        run: |
          set +x

          if [ -z "${YANDEX_DOC_URL:-}" ]; then
            echo "ERROR: YANDEX_DOC_URL is not configured."
            exit 1
          fi

          echo "::add-mask::$YANDEX_DOC_URL"
          echo "YANDEX_DOC_URL: configured"

      - name: Install dependencies
        shell: bash
        run: |
          set +x

          sudo apt-get update
          sudo apt-get install -y git golang-go iptables

      - name: Download OpenFlux
        shell: bash
        run: |
          set +x
          git clone https://github.com/p1neappleXpress/OpenFlux.git
          cd OpenFlux

          # OpenFlux Android v0.6.0 был синхронизирован
          # с upstream-состоянием от 2026-09-12.
          git log --oneline --all --since="2026-09-12 00:00:00" --until="2026-09-13 00:00:00"

          echo "OpenFlux commit:"
          git rev-parse --short HEAD

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache: false

      - name: Verify Go
        shell: bash
        run: |
          set +x
          go version

      - name: Build OpenFlux
        shell: bash
        run: |
          set +x

          cd OpenFlux

          go mod tidy
          go build -o universal-bypass-tool .

          chmod +x universal-bypass-tool

          echo "Build successful."

      - name: Check raw sockets
        shell: bash
        run: |
          set +x

      - name: Configure iptables
        shell: bash
        run: |
          set +x
          sudo iptables -C OUTPUT \
            -p tcp \
            --tcp-flags RST RST \
            -j DROP 2>/dev/null || \
          sudo iptables -A OUTPUT \
            -p tcp \
            --tcp-flags RST RST \
            -j DROP

      - name: Start OpenFlux
        shell: bash
        run: |
          set +x
          cd OpenFlux
          exec sudo ./universal-bypass-tool \
            --role=exit \
            --mode=l3 \
            --transport=vyandex \
            --url="$YANDEX_DOC_URL" \
            --debug
